name: Test V2Ray Configs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Xray
        run: |
          mkdir -p xray-linux-64
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip -d xray-linux-64
          chmod +x xray-linux-64/xray
          ./xray-linux-64/xray version

      - name: Prepare subscription list
        env:
          SUBSCRIPTION_URLS: ${{ secrets.SUBSCRIPTION_URLS }}
        run: |
          printf '%s\n' "$SUBSCRIPTION_URLS" > subs.txt
          echo "Subscription list prepared."

      - name: Run V2Ray/Xray tests
        run: |
          python main.py --auto

      - name: Check working.txt
        run: |
          if [ ! -f working.txt ]; then
            echo "ERROR: working.txt was not created."
            exit 1
          fi

          echo "Working configs:"
          wc -l working.txt
          head -n 5 working.txt

      - name: Prepare GitHub Pages
        run: |
          mkdir -p public

          cp working.txt public/working.txt

          if [ -f bad_subs.txt ]; then
            cp bad_subs.txt public/bad_subs.txt
          fi

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="robots" content="noindex,nofollow">
            <title>Subscription</title>
          </head>
          <body>
            <h1>V2Ray Subscription</h1>
            <p>Updated automatically.</p>
          </body>
          </html>
          EOF

      - name: Publish subscription to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-test-results
          path: |
            working.txt
            bad_subs.txt
          if-no-files-found: ignore
