name: Test V2Ray Configs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2. Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # 3. Dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================================================
      # 4. Download Xray
      # =========================================================
      - name: Download Xray
        run: |
          set -e

          rm -rf xray-linux-64
          mkdir -p xray-linux-64

          wget -q \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip \
            -O Xray-linux-64.zip

          unzip -o Xray-linux-64.zip -d xray-linux-64

          chmod +x xray-linux-64/xray

          ./xray-linux-64/xray version

      # =========================================================
      # 5. Prepare subscriptions
      # =========================================================
      - name: Prepare subscription list
        env:
          SUBSCRIPTION_URLS: ${{ secrets.SUBSCRIPTION_URLS }}
        run: |
          set -e

          printf '%s\n' "$SUBSCRIPTION_URLS" > subs.txt

          echo "Subscription list prepared."

          echo "Number of subscription URLs:"
          grep -cve '^[[:space:]]*$' subs.txt || true

      # =========================================================
      # 6. Run ALL tests
      #
      # Important:
      # We disable live output because the original LiveResultWriter
      # writes intermediate Ping/Latency results into working.txt.
      #
      # Everything goes into test-results.txt instead.
      # =========================================================
      - name: Run V2Ray/Xray tests
        run: |
          set -e

          rm -f working.txt
          rm -f test-results.txt

          python main.py \
            --auto \
            --no-live-output \
            --output test-results.txt

      # =========================================================
      # 7. Build CLEAN subscription
      #
      # ONLY:
      # SPEED FAST
      #
      # This section contains configs that:
      #   Ping passed
      #   Latency passed
      #   Speed test passed
      #   Speed >= SPEED_MIN_MBPS
      #
      # Since Speed is only executed after Latency,
      # a config inside SPEED FAST has passed the previous stages too.
      # =========================================================
      - name: Build clean working subscription
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path("test-results.txt")
          output = Path("working.txt")

          protocols = (
              "vless://",
              "vmess://",
              "trojan://",
              "ss://",
              "hy2://",
              "hysteria2://",
          )

          if not source.exists():
              raise SystemExit(
                  "ERROR: test-results.txt was not created."
              )

          text = source.read_text(
              encoding="utf-8",
              errors="replace"
          )

          # -----------------------------------------------------
          # Find the final SPEED FAST section
          # -----------------------------------------------------
          match = re.search(
              r"^===\s*SPEED FAST\b.*$",
              text,
              flags=re.MULTILINE
          )

          clean_configs = []

          if match:
              section = text[match.end():]

              for raw_line in section.splitlines():

                  line = raw_line.strip()

                  # Ignore empty lines before first config
                  if not line:
                      if clean_configs:
                          break
                      continue

                  # Stop at another section
                  if line.startswith("==="):
                      break

                  # The original output is:
                  #
                  # URL | latency | speed
                  #
                  # We ONLY want the URL.
                  url = line.split(" | ", 1)[0].strip()

                  if not url.startswith(protocols):
                      continue

                  # Extra safety:
                  # Don't allow error/result text into subscription.
                  if "|" in url:
                      continue

                  clean_configs.append(url)

          # -----------------------------------------------------
          # Remove duplicates while preserving order
          # -----------------------------------------------------
          unique_configs = list(dict.fromkeys(clean_configs))

          # -----------------------------------------------------
          # Write CLEAN subscription
          # -----------------------------------------------------
          output.write_text(
              "\n".join(unique_configs) + (
                  "\n" if unique_configs else ""
              ),
              encoding="utf-8"
          )

          print("=" * 70)
          print("CLEAN SUBSCRIPTION")
          print("=" * 70)
          print(f"Qualified configs: {len(unique_configs)}")
          print()

          for index, config in enumerate(unique_configs, 1):
              print(f"{index:04d}  {config}")

          print()
          print("=" * 70)

      # =========================================================
      # 8. Validate clean output
      # =========================================================
      - name: Validate working.txt
        shell: bash
        run: |
          set -e

          if [ ! -f working.txt ]; then
            echo "ERROR: working.txt was not created."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "FINAL SUBSCRIPTION VALIDATION"
          echo "=========================================="

          TOTAL=$(grep -cve '^[[:space:]]*$' working.txt || true)

          echo "Final working configs: $TOTAL"

          # -----------------------------------------------------
          # Make sure no report sections exist
          # -----------------------------------------------------
          if grep -Eq '^===|PING PASSED|LATENCY PASSED|SPEED SLOW|SPEED FAST' working.txt; then
            echo "ERROR: working.txt still contains test-report data."
            exit 1
          fi

          # -----------------------------------------------------
          # Make sure every line is a supported proxy URL
          # -----------------------------------------------------
          if [ "$TOTAL" -gt 0 ]; then
            if grep -Ev '^(vless|vmess|trojan|ss|hy2|hysteria2)://' working.txt; then
              echo "ERROR: Invalid data found in working.txt."
              exit 1
            fi
          fi

          # -----------------------------------------------------
          # Make sure no duplicate configs exist
          # -----------------------------------------------------
          DUPLICATES=$(sort working.txt | uniq -d | wc -l)

          if [ "$DUPLICATES" -ne 0 ]; then
            echo "ERROR: Duplicate configs found."
            exit 1
          fi

          echo
          echo "Validation successful."
          echo "Only final qualified configs will be published."

          echo
          echo "First 10 configs:"
          head -n 10 working.txt || true

      # =========================================================
      # 9. Prepare GitHub Pages
      # =========================================================
      - name: Prepare GitHub Pages
        run: |
          set -e

          rm -rf public
          mkdir -p public

          # ONLY CLEAN SUBSCRIPTION
          cp working.txt public/working.txt

          # Bad subscriptions remain available for debugging,
          # but they are NOT part of the subscription.
          if [ -f bad_subs.txt ]; then
            cp bad_subs.txt public/bad_subs.txt
          fi

          # Simple index page
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="robots" content="noindex,nofollow">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>V2Ray Subscription</title>
          </head>

          <body>
            <h1>V2Ray Subscription</h1>
            <p>Automatically updated.</p>

            <p>
              <a href="./working.txt">
                Download working subscription
              </a>
            </p>
          </body>
          </html>
          EOF

      # =========================================================
      # 10. Publish
      # =========================================================
      - name: Publish subscription to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      # =========================================================
      # 11. Upload diagnostic results
      # =========================================================
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2ray-test-results
          path: |
            test-results.txt
            working.txt
            bad_subs.txt
          if-no-files-found: ignore
